[workspace]
members = [
  "backend/crates/domain",
  "backend/crates/app",
  "backend/crates/infrastructure",
  "backend/api",
  "backend/worker"
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
mulx-domain = { path = "backend/crates/domain" }
mulx-app = { path = "backend/crates/app" }
mulx-infrastructure = { path = "backend/crates/infrastructure" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "migrate", "chrono"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
