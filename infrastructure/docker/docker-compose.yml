version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mulx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mulx}
      POSTGRES_USER: ${POSTGRES_USER:-mulx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mulx-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: mulx-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mulx:mulx-password@postgres:5432/mulx
      HTTP_PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
